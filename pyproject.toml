[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aionsite"
version = "0.2.0"
description = "Sovereign On-Premise Agentic AI Workbench"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP042"]  # UP042: (str, Enum) kept for broad JSON compat

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # `pytest.raises(Exception)` is fine for validation-error tests

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
